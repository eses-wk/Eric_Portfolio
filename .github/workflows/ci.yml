name: CI

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build for GitHub Pages
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /Eric_Portfolio
          NEXT_PUBLIC_SITE_URL: https://eses-wk.github.io/Eric_Portfolio
